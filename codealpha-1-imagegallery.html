<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#111827;
    color:white;
}

/* Navbar */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* Hero Section */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(rgba(0,0,0,.5),
    rgba(0,0,0,.5)),
    url('https://picsum.photos/id/1015/1600/900');
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:60px;
}

.hero p{
    margin:20px 0;
    font-size:20px;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    background:#00e5ff;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.4s;
}

.btn:hover{
    transform:scale(1.1);
}

/* Gallery */
.gallery-section{
    padding:100px 8%;
}

.gallery-section h2{
    text-align:center;
    margin-bottom:30px;
    font-size:40px;
}

.filters{
    text-align:center;
    margin-bottom:30px;
}

.filters button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:#1f2937;
    color:white;
    transition:.3s;
}

.filters button:hover{
    background:#00e5ff;
    color:black;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.gallery-item{
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.5);
}

.gallery-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:.5s;
}

.gallery-item:hover img{
    transform:scale(1.15);
}

/* Lightbox */
.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.lightbox img{
    max-width:85%;
    max-height:80%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    cursor:pointer;
}

.prev,.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    border:none;
    padding:15px;
    font-size:24px;
    cursor:pointer;
    border-radius:50%;
}

.prev{left:20px;}
.next{right:20px;}

/* Footer */
footer{
    text-align:center;
    padding:20px;
    background:#0f172a;
}

@media(max-width:768px){

.hero h1{
    font-size:40px;
}

.hero p{
    font-size:16px;
}

nav{
    flex-direction:column;
    gap:10px;
}
}
</style>
</head>
<body>

<nav>
<div class="logo">📸 Gallery</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#gallery">Gallery</a></li>
</ul>
</nav>

<section class="hero">
<div>
<h1>Capture Every Moment</h1>
<p>Beautiful Responsive Image Gallery</p>
<a href="#gallery" class="btn">Explore Gallery</a>
</div>
</section>

<section class="gallery-section" id="gallery">

<h2>My Gallery</h2>

<div class="filters">
<button onclick="filterImages('all')">All</button>
<button onclick="filterImages('camera')">Camera</button>
<button onclick="filterImages('snapchat')">Snapchat</button>
<button onclick="filterImages('whatsapp')">WhatsApp</button>
</div>

<div class="gallery">

<div class="gallery-item camera">
<img src="https://picsum.photos/id/1015/600/400" alt="">
</div>

<div class="gallery-item camera">
<img src="https://picsum.photos/id/1016/600/400" alt="">
</div>

<div class="gallery-item snapchat">
<img src="https://picsum.photos/id/1025/600/400" alt="">
</div>

<div class="gallery-item snapchat">
<img src="https://picsum.photos/id/1035/600/400" alt="">
</div>

<div class="gallery-item whatsapp">
<img src="https://picsum.photos/id/1043/600/400" alt="">
</div>

<div class="gallery-item whatsapp">
<img src="https://picsum.photos/id/1050/600/400" alt="">
</div>

</div>

</section>

<footer>
© 2026 Modern Image Gallery
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">

<span class="close">&times;</span>

<button class="prev">❮</button>

<img id="lightbox-img">

<button class="next">❯</button>

</div>

<script>

const images = document.querySelectorAll(".gallery-item img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

let currentIndex = 0;

images.forEach((img,index)=>{

img.addEventListener("click",()=>{

currentIndex=index;
lightbox.style.display="flex";
lightboxImg.src=img.src;

});

});

closeBtn.addEventListener("click",()=>{
lightbox.style.display="none";
});

nextBtn.addEventListener("click",()=>{

currentIndex=(currentIndex+1)%images.length;
lightboxImg.src=images[currentIndex].src;

});

prevBtn.addEventListener("click",()=>{

currentIndex=(currentIndex-1+images.length)%images.length;
lightboxImg.src=images[currentIndex].src;

});

lightbox.addEventListener("click",(e)=>{

if(e.target===lightbox){
lightbox.style.display="none";
}

});

function filterImages(category){

const items=document.querySelectorAll(".gallery-item");

items.forEach(item=>{

if(category==="all" || item.classList.contains(category)){
item.style.display="block";
}
else{
item.style.display="none";
}

});

}

document.addEventListener("keydown",(e)=>{

if(lightbox.style.display==="flex"){

if(e.key==="ArrowRight"){
nextBtn.click();
}

if(e.key==="ArrowLeft"){
prevBtn.click();
}

if(e.key==="Escape"){
lightbox.style.display="none";
}

}

});

</script>

</body>
</html>
