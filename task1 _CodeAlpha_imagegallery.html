<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

/* Filter Buttons */
.filters{
    margin-bottom:20px;
}

.filters button{
    padding:10px 20px;
    margin:5px;
    border:none;
    background:#333;
    color:white;
    cursor:pointer;
    border-radius:5px;
    transition:0.3s;
}

.filters button:hover,
.filters button.active{
    background:#ff9800;
}

/* Gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.gallery-item{
    overflow:hidden;
    border-radius:10px;
    cursor:pointer;
}

.gallery-item img{
    width:100%;
    display:block;
    transition:transform 0.5s ease;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

/* Lightbox */
.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.lightbox img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.prev,.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:white;
    border:none;
    padding:10px 15px;
    font-size:24px;
    cursor:pointer;
    border-radius:50%;
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

/* Responsive */
@media(max-width:768px){
    .lightbox img{
        max-width:95%;
    }
}
</style>

</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="filters">
    <button class="active" onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1015/500/300" onclick="openLightbox(0)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1011/500/300" onclick="openLightbox(1)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/1025/500/300" onclick="openLightbox(2)">
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1039/500/300" onclick="openLightbox(3)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1043/500/300" onclick="openLightbox(4)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/237/500/300" onclick="openLightbox(5)">
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>

    <button class="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightbox-img">

    <button class="next" onclick="changeImage(1)">❯</button>
</div>

<script>
const images = document.querySelectorAll(".gallery-item img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let currentIndex = 0;

function openLightbox(index){
    currentIndex = index;
    lightbox.style.display = "flex";
    lightboxImg.src = images[currentIndex].src;
}

function closeLightbox(){
    lightbox.style.display = "none";
}

function changeImage(step){
    currentIndex += step;

    if(currentIndex >= images.length){
        currentIndex = 0;
    }

    if(currentIndex < 0){
        currentIndex = images.length - 1;
    }

    lightboxImg.src = images[currentIndex].src;
}

function filterImages(category){

    let items = document.querySelectorAll(".gallery-item");

    items.forEach(item => {

        if(category === "all" ||
           item.classList.contains(category)){
            item.style.display = "block";
        }
        else{
            item.style.display = "none";
        }
    });

    document.querySelectorAll(".filters button")
    .forEach(btn => btn.classList.remove("active"));

    event.target.classList.add("active");
}
</script>

</body>
</html>
