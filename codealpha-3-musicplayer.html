<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Hub Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(-45deg,#0f172a,#1e293b,#7c3aed,#0ea5e9);
background-size:400% 400%;
animation:bg 10s ease infinite;
color:white;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

section{
min-height:100vh;
padding:40px;
}

.hero{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:4rem;
margin-bottom:20px;
text-shadow:0 0 20px cyan;
}

.hero p{
max-width:700px;
font-size:1.2rem;
margin-bottom:30px;
}

.btn{
padding:15px 35px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border:none;
border-radius:30px;
color:white;
cursor:pointer;
font-size:18px;
transition:.4s;
}

.btn:hover{
transform:translateY(-5px);
background:cyan;
color:black;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:50px;
width:100%;
}

.card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
transition:.4s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

.player-section{
display:flex;
justify-content:center;
align-items:center;
}

.player{
width:900px;
max-width:95%;
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
padding:25px;
border-radius:25px;
display:flex;
gap:20px;
}

.left{
flex:1;
text-align:center;
}

.cover{
width:250px;
height:250px;
border-radius:50%;
margin:auto;
overflow:hidden;
border:5px solid cyan;
animation:spin 10s linear infinite;
animation-play-state:paused;
}

.cover.playing{
animation-play-state:running;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

.song-info h2{
margin-top:20px;
}

.controls{
margin-top:20px;
}

.controls button{
width:60px;
height:60px;
border:none;
border-radius:50%;
margin:10px;
font-size:20px;
cursor:pointer;
background:white;
transition:.3s;
}

.controls button:hover{
transform:scale(1.1);
}

.progress{
width:100%;
margin-top:15px;
}

.volume{
width:50%;
margin-top:15px;
}

.playlist{
flex:1;
}

.playlist h3{
margin-bottom:15px;
}

.playlist ul{
list-style:none;
}

.playlist li{
padding:12px;
margin:8px 0;
background:rgba(255,255,255,.1);
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.playlist li:hover{
background:cyan;
color:black;
}

.time{
display:flex;
justify-content:space-between;
margin-top:5px;
}

@media(max-width:768px){

.player{
flex-direction:column;
}

.hero h1{
font-size:2.5rem;
}

.cover{
width:200px;
height:200px;
}
}
</style>
</head>
<body>

<section class="hero">

<h1>🎵 Music Hub Pro</h1>

<p>
Modern JavaScript Music Player with Playlist, Progress Bar,
Volume Control, Autoplay and Animated UI.
</p>

<button class="btn" onclick="document.getElementById('music').scrollIntoView({behavior:'smooth'})">
Open Music Player
</button>

<div class="cards">

<div class="card">
<img src="https://picsum.photos/300/300?1">
<h2>Pop Collection</h2>
<p>Trending pop hits.</p>
</div>

<div class="card">
<img src="https://picsum.photos/300/300?2">
<h2>Rock Legends</h2>
<p>Classic rock songs.</p>
</div>

<div class="card">
<img src="https://picsum.photos/300/300?3">
<h2>Chill Beats</h2>
<p>Relaxing music playlist.</p>
</div>

</div>

</section>

<section id="music" class="player-section">

<div class="player">

<div class="left">

<div class="cover" id="cover">
<img src="https://picsum.photos/400/400?music" id="coverImg">
</div>

<div class="song-info">
<h2 id="title">Song Title</h2>
<p id="artist">Artist Name</p>
</div>

<input type="range" id="progress" class="progress" value="0">

<div class="time">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>

<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="playPause()" id="playBtn">▶</button>
<button onclick="nextSong()">⏭</button>
</div>

<input type="range" id="volume" class="volume"
min="0" max="1" step="0.1" value="1">

</div>

<div class="playlist">

<h3>🎶 Playlist</h3>

<ul id="playlist"></ul>

</div>

</div>

</section>

<audio id="audio"></audio>

<script>

const songs=[
{
title:"Dream Night",
artist:"Artist One",
src:"song1.mp3"
},
{
title:"Summer Vibes",
artist:"Artist Two",
src:"song2.mp3"
},
{
title:"Ocean Waves",
artist:"Artist Three",
src:"song3.mp3"
}
];

const audio=document.getElementById("audio");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");
const volume=document.getElementById("volume");
const playlist=document.getElementById("playlist");
const cover=document.getElementById("cover");

let currentSong=0;

function loadSong(index){

title.innerText=songs[index].title;
artist.innerText=songs[index].artist;
audio.src=songs[index].src;
}

loadSong(currentSong);

function playPause(){

if(audio.paused){

audio.play();
playBtn.innerHTML="⏸";
cover.classList.add("playing");

}else{

audio.pause();
playBtn.innerHTML="▶";
cover.classList.remove("playing");
}
}

function nextSong(){

currentSong++;

if(currentSong>=songs.length){
currentSong=0;
}

loadSong(currentSong);
audio.play();
playBtn.innerHTML="⏸";
cover.classList.add("playing");
}

function prevSong(){

currentSong--;

if(currentSong<0){
currentSong=songs.length-1;
}

loadSong(currentSong);
audio.play();
playBtn.innerHTML="⏸";
cover.classList.add("playing");
}

audio.addEventListener("loadedmetadata",()=>{

progress.max=audio.duration;

document.getElementById("duration").innerText=
formatTime(audio.duration);
});

audio.addEventListener("timeupdate",()=>{

progress.value=audio.currentTime;

document.getElementById("current").innerText=
formatTime(audio.currentTime);
});

progress.addEventListener("input",()=>{

audio.currentTime=progress.value;
});

volume.addEventListener("input",()=>{

audio.volume=volume.value;
});

function formatTime(time){

let min=Math.floor(time/60);
let sec=Math.floor(time%60);

if(sec<10) sec="0"+sec;

return min+":"+sec;
}

audio.addEventListener("ended",()=>{

nextSong();
});

songs.forEach((song,index)=>{

const li=document.createElement("li");

li.innerText=song.title+" - "+song.artist;

li.onclick=()=>{

currentSong=index;
loadSong(index);

audio.play();
playBtn.innerHTML="⏸";
cover.classList.add("playing");
};

playlist.appendChild(li);

});

</script>

</body>
</html>
